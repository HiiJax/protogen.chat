when:
  - event: [ "manual" ]
  - event: ["push"]
    branch: ["main"]

engine: nixery

dependencies:
  nixpkgs:
    - kaniko

environment:
  DOCKER_CONFIG: "/kaniko/.docker"

steps:
  - name: Configure Kaniko
    command: |
      mkdir -p /kaniko/.docker/
      echo "{
        \"auths\": {
          \"https://atcr.io/v1\":{
            \"auth\": \"$ATCR_CREDENTIALS\"
          }
        }
      }" > /kaniko/.docker/config.json

  - name: Build image
    command: |
      executor \
        --context=$(pwd) \
        --dockerfile=$(pwd)/Dockerfile \
        --destination="atcr.io/hiijax.net/protogen.chat:latest" \
        --push-retry=3 \
        --skip-push-permission-check
